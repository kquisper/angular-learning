<div>
  <p class="pt-2 font-bold">Module Search</p>
  <hr class="my-2">

  <div class="p-4 flex flex-col md:flex-row gap-4">

    <!-- PANEL IZQUIERDO - Buscador -->
    <div class="w-full md:w-80 md:shrink-0">
      <div class="erp-panel">

        <h3 class="text-sm font-bold border-b border-[#999] mb-3 pb-1 text-[#003399]">
          Searching for GIFs
        </h3>

        <div class="space-y-3">

          <div>
            <span>Busca GIF por nombre</span>
            <input
              type="text"
              class="input-erp"
              placeholder="Ej. cats, funny, ryan gosling..."
              (keyup.enter)="onsearch(txtSearch.value)"
              #txtSearch
            />
          </div>

        </div>
      </div>

   

      
    </div>

    <!-- Divisor -->
    <div class="w-full h-px md:w-px md:h-auto bg-black"></div>

    <!-- PANEL DERECHO - Resultados -->
    <div class="flex-1">



        <app-gifs-list [gifslist]="gifs()" />

    </div>

    

  </div>
</div>
