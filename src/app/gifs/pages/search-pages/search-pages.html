<div>
  <p class="pt-2 font-bold">Module Search</p>
  <hr class="my-2">

  <div class="p-4 flex flex-col md:flex-row gap-4">

    <!-- PANEL IZQUIERDO - Buscador -->
    <div class="w-full md:w-80 md:shrink-0">
      <div class="erp-panel">

        <h3 class="text-sm font-bold border-b border-[#999] mb-3 pb-1 text-[#003399]">
          Searching for GIFs
        </h3>

        <div class="space-y-3">

          <div>
            <span>Busca GIF por nombre</span>
            <input
              type="text"
              class="input-erp"
              placeholder="Ej. cats, funny, ryan gosling..."
            />
          </div>

          <div class="pt-2 flex gap-2">
            <button class="btn btn-primary px-6">Buscar</button>
            <button class="btn btn-secondary px-6">Limpiar</button>
          </div>

          <!-- Estado -->
          <div class="border-t border-[#999] pt-2 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-[#ffcc00] inline-block border border-[#808080]"></span>
            <span class="text-xs text-[#444]">Listo</span>
          </div>

        </div>
      </div>
    </div>

    <!-- Divisor -->
    <div class="w-full h-px md:w-px md:h-auto bg-black"></div>

    <!-- PANEL DERECHO - Resultados -->
    <div class="flex-1">
      <div class="erp-panel h-full">

        <h3 class="text-sm font-bold border-b border-[#999] mb-3 pb-1 text-[#003399]">
          Resultados
        </h3>

        <!-- app-gifs-list irá aquí -->
        <p class="text-xs text-[#808080] italic">Ingrese un término y presione Buscar...</p>

      </div>
    </div>

  </div>
</div>
